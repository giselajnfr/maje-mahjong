<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MAJÉ — Mahjong Scorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --maje-primary:#5B0015; --maje-secondary:#E4D6D6; --maje-bg:#F7F4F0;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  *{box-sizing:border-box;}
  body{background:var(--maje-bg); color:var(--maje-primary); font-family:'Georgia','Iowan Old Style',serif; min-height:100%;}
  .sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;}
  .btn{display:flex;align-items:center;justify-content:center;border-radius:14px;padding:16px;font-size:16px;font-weight:600;min-height:56px;transition:transform .1s;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--maje-primary);color:#fff;}
  .btn-secondary{background:#fff;color:var(--maje-primary);border:1.5px solid var(--maje-primary);}
  .btn-ghost{background:var(--maje-secondary);color:var(--maje-primary);}
  .tile{
    background:linear-gradient(180deg,#fffdf8,#f3ede2); border:1px solid #d8cdbd; border-radius:8px;
    box-shadow:0 2px 3px rgba(0,0,0,.12); display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-width:44px; min-height:58px; font-size:22px; font-weight:700; color:#3a1c22; cursor:pointer; user-select:none;
    font-family:'Segoe UI Symbol','Noto Sans Symbols2','Apple Symbols',-apple-system,sans-serif;
    transition:transform .08s;
  }
  .tile:active{transform:translateY(2px) scale(.96);}
  .tile.selected{outline:2.5px solid var(--maje-primary); box-shadow:0 3px 6px rgba(91,0,21,.35);}
  .tile.mini{min-width:30px;min-height:40px;font-size:15px;}
  .tile img{display:block;height:44px;width:auto;max-width:100%;pointer-events:none;}
  .tile.mini img{height:30px;}
  .card{background:#fff;border-radius:16px;border:1px solid var(--maje-secondary);padding:16px;}
  .pill{border-radius:999px;padding:4px 12px;font-size:12px;font-weight:700;background:var(--maje-secondary);color:var(--maje-primary);}
  .section-title{font-size:11px;letter-spacing:.14em;font-weight:700;color:#8a5a63;text-transform:uppercase;margin-bottom:8px;}
  ::-webkit-scrollbar{display:none;}
  @keyframes pop{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
  .pop{animation:pop .25s ease-out;}
  .lang-switcher{
    position:fixed; top:12px; right:12px; z-index:50; display:flex; gap:2px;
    padding:3px; border:1px solid var(--maje-secondary); border-radius:999px;
    background:rgba(255,255,255,.92); box-shadow:0 2px 8px rgba(91,0,21,.08);
    backdrop-filter:blur(6px);
  }
  .lang-switcher button{
    border:0; border-radius:999px; padding:5px 9px; min-width:34px;
    font:700 11px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    color:var(--maje-primary); background:transparent; cursor:pointer;
  }
  .lang-switcher button.active{background:var(--maje-primary);color:#fff;}
</style>

  <meta name="description" content="MAJÉ — Mahjong scorer and game companion.">
  <meta name="theme-color" content="#5B0015">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MAJÉ">
  <link rel="manifest" href="./manifest.json">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
</head>
<body>
<div class="lang-switcher" aria-label="Language">
  <button id="langEN" onclick="setLanguage('en')">EN</button>
  <button id="langID" onclick="setLanguage('id')">ID</button>
</div>
<div id="app" class="max-w-md mx-auto min-h-screen pb-10"></div>

function syncLanguageNames(){
  Object.assign(WIND_NAME, LANG==='id'?{E:'Timur',S:'Selatan',W:'Barat',N:'Utara'}:EN_WIND_NAME);
  Object.assign(DRAG_NAME, LANG==='id'?{R:'Naga Merah',G:'Naga Hijau',W:'Naga Putih'}:EN_DRAG_NAME);
  Object.assign(SUIT_NAME, LANG==='id'?{CHR:'Karakter',BAM:'Bambu',DOT:'Titik'}:EN_SUIT_NAME);

function tileLabel(k){
  if(k.startsWith('WIND_')) return WIND_NAME[k.slice(5)];
  if(k.startsWith('DRAG_')) return DRAG_NAME[k.slice(5)];
  if(k.startsWith('FLW_')) return FLOWER_NAME[k]+' ('+SEAT_NUM[FLOWER_SEAT[k]]+')';
  const suit=k.slice(0,3), val=k.slice(3);
  return val+' '+SUIT_NAME[suit];
}

function tileShort(k){
  if(k.startsWith('FLW_')) return TILE_GLYPH[k]+SEAT_NUM[FLOWER_SEAT[k]];
  if(TILE_IMG[k]) return `<img src="${TILE_IMG[k]}" alt="${k}">`;
  return TILE_GLYPH[k]||k;
}
function tileInfo(k){
  if(k.startsWith('WIND_')) return {honor:true,kind:'WIND',val:k.slice(5)};
  if(k.startsWith('DRAG_')) return {honor:true,kind:'DRAG',val:k.slice(5)};
  return {honor:false,suit:k.slice(0,3),val:parseInt(k.slice(3))};
}
function windName(w){return WIND_NAME[w]||w;}

/* ============================= SCORING ENGINE ============================= */
function tileCompare(a,b){
  const order={CHR:0,BAM:1,DOT:2};
  const ia=tileInfo(a), ib=tileInfo(b);
  const ra = ia.honor?(ia.kind==='WIND'?10:11):order[ia.suit];
  const rb = ib.honor?(ib.kind==='WIND'?10:11):order[ib.suit];
  if(ra!==rb) return ra-rb;
  if(!ia.honor && !ib.honor) return ia.val-ib.val;
  return String(ia.val).localeCompare(String(ib.val));
}
function sortTiles(arr){ return [...arr].sort(tileCompare); }
/** Total physical copies of `tile` in the hand pool. Max allowed is 4. */
function countAllCopies(draft,tile){
  return draft.concealedTiles.filter(t=>t===tile).length;
}
function multisetSubtract(pool,toRemove){
  let p=pool.slice();
  toRemove.forEach(t=>{ const idx=p.indexOf(t); if(idx>=0) p.splice(idx,1); });
  return p;
}
/** Tiles not yet tagged into a declared Chi/Pong/Kong group or the declared pair. */
function ungroupedTiles(draft){
  const used=draft.groups.flatMap(g=>g.tiles).concat(draft.declaredPair||[]);
  return multisetSubtract(draft.concealedTiles,used);
}
/** Same as ungroupedTiles but keeps each tile's original index in concealedTiles, so removal always deletes the right physical tile. */
function ungroupedWithIndices(draft){
  const used=draft.groups.flatMap(g=>g.tiles).concat(draft.declaredPair||[]).slice();
  const result=[];
  draft.concealedTiles.forEach((t,idx)=>{
    const ui=used.indexOf(t);
    if(ui>=0){ used.splice(ui,1); } else { result.push({tile:t,idx}); }
  });
  return result;
}
/** How many physical tiles a complete winning hand needs: 14 base, +1 per Kong (manually declared or auto-detected from 4 copies of a tile). */
function targetTileCount(draft){
  const manualKongs=draft.groups.filter(g=>g.type==='KONG').length;
  const autoKongs=autoDetectMelds(ungroupedTiles(draft)).melds.length;
  return 14+manualKongs+autoKongs;
}
/** Does this tile selection form a valid Chi / Pong / Kong / Pair? Used both to enable the buttons and to validate on confirm. */
function selectionValidFor(sel,type){
  if(type==='PONG') return sel.length===3 && sel[0]===sel[1] && sel[1]===sel[2];
  if(type==='KONG') return sel.length===4 && sel.every(t=>t===sel[0]);
  if(type==='PAIR') return sel.length===2 && sel[0]===sel[1];
  if(type==='CHI'){
    if(sel.length!==3) return false;
    const infos=sel.map(tileInfo);
    if(infos.some(i=>i.honor)) return false;
    if(new Set(infos.map(i=>i.suit)).size!==1) return false;
    const vals=infos.map(i=>i.val).sort((a,b)=>a-b);
    return vals[1]===vals[0]+1 && vals[2]===vals[1]+1;
  }
  return false;
}
function removeN(arr,val,n){let a=arr.slice();for(let i=0;i<n;i++)a.splice(a.indexOf(val),1);return a;}

function solveGroups(tiles){
  if(tiles.length===0) return [[]];
  const sorted=sortTiles(tiles);
  const t=sorted[0], info=tileInfo(t);
  let results=[];
  const cnt=sorted.filter(x=>x===t).length;
  if(cnt>=3){
    const rest=removeN(sorted,t,3);
    for(const sub of solveGroups(rest)) results.push([{type:'PONG',tiles:[t,t,t]},...sub]);
  }
  if(!info.honor && info.val<=7){
    const t2=info.suit+(info.val+1), t3=info.suit+(info.val+2);
    if(sorted.includes(t2) && sorted.includes(t3)){
      let rest=sorted.slice();
      rest.splice(rest.indexOf(t),1); rest.splice(rest.indexOf(t2),1); rest.splice(rest.indexOf(t3),1);
      for(const sub of solveGroups(rest)) results.push([{type:'CHI',tiles:[t,t2,t3]},...sub]);
    }
  }
  return results.slice(0,25);
}
function enumerateDecomp(tiles,neededGroups){
  if(neededGroups<0) return [];
  if(neededGroups===0){
    if(tiles.length!==2 || tiles[0]!==tiles[1]) return [];
    return [{pair:tiles[0],groups:[]}];
  }
  const sorted=sortTiles(tiles);
  const uniq=[...new Set(sorted)];
  let out=[];
  for(const p of uniq){
    if(sorted.filter(x=>x===p).length>=2){
      const rest=removeN(sorted,p,2);
      for(const groups of solveGroups(rest)){
        if(groups.length===neededGroups) out.push({pair:p,groups});
      }
    }
    if(out.length>40) break;
  }
  return out;
}
function meldsToGroups(melds){return melds.map(m=>({type:m.type==='CHI'?'CHI':'PONG',isKong:m.type==='KONG',isExposed:m.isExposed,tiles:m.tiles}));}
/** Quick Score has one tile pool (no meld builder). Any tile with exactly 4 copies is automatically a concealed Kong; everything else is left as loose concealed tiles for the standard decomposition to figure out. */
function autoDetectMelds(tiles){
  const counts={}; tiles.forEach(t=>counts[t]=(counts[t]||0)+1);
  const melds=[]; let remaining=tiles.slice();
  Object.keys(counts).forEach(t=>{
    if(counts[t]===4){
      melds.push({type:'KONG',tiles:[t,t,t,t],isExposed:false});
      for(let i=0;i<4;i++){ remaining.splice(remaining.indexOf(t),1); }
    }
  });
  return {melds,concealedTiles:remaining};
}

function sevenPairs(all){
  if(all.length!==14) return false;
  const c={}; all.forEach(t=>c[t]=(c[t]||0)+1);
  const keys=Object.keys(c);
  return keys.length===7 && keys.every(k=>c[k]===2);
}
function thirteenOrphans(all){
  if(all.length!==14) return false;
  const req=['CHR1','CHR9','BAM1','BAM9','DOT1','DOT9','WIND_E','WIND_S','WIND_W','WIND_N','DRAG_R','DRAG_G','DRAG_W'];
  const c={}; all.forEach(t=>c[t]=(c[t]||0)+1);
  if(Object.keys(c).some(k=>!req.includes(k))) return false;
  const missing=req.filter(k=>!c[k]);
  if(missing.length>0) return false;
  const dup=req.filter(k=>c[k]===2);
  return dup.length===1 && req.reduce((s,k)=>s+(c[k]||0),0)===14;
}
function nineGates(concealed){
  if(concealed.length!==14) return false;
  const suits=new Set(concealed.filter(t=>!tileInfo(t).honor).map(t=>tileInfo(t).suit));
  if(concealed.some(t=>tileInfo(t).honor)) return false;
  if(suits.size!==1) return false;
  const suit=[...suits][0];
  const base={1:3,2:1,3:1,4:1,5:1,6:1,7:1,8:1,9:3};
  const c={}; concealed.forEach(t=>{const v=tileInfo(t).val; c[v]=(c[v]||0)+1;});
  let extra=0;
  for(let v=1;v<=9;v++){
    const diff=(c[v]||0)-base[v];
    if(diff<0) return false;
    extra+=diff;
  }
  return extra===1;
}
function fourKongs(melds,concealed){
  return melds.filter(m=>m.type==='KONG').length===4 && concealed.length===2 && concealed[0]===concealed[1];
}
function groupHasOrphan(g){
  if(g.type==='PONG'){const i=tileInfo(g.tiles[0]); return i.honor || i.val===1 || i.val===9;}
  return g.tiles.some(t=>{const i=tileInfo(t); return !i.honor && (i.val===1||i.val===9);});
}
function scoreStandard(groups,pair,roundWind,seatWind){
  const patterns=[];
  const allChow=groups.every(g=>g.type==='CHI');
  const allPong=groups.every(g=>g.type==='PONG');
  if(allChow) patterns.push({name:'All Chows',points:1,detail:'All four sets are Chows (sequences).'});
  if(allPong) patterns.push({name:'All Pongs',points:3,detail:'All four sets are Pongs or Kongs — no Chows.'});
  const allSetTiles=groups.flatMap(g=>g.tiles).concat([pair]);
  const suitsUsed=new Set(allSetTiles.filter(t=>!tileInfo(t).honor).map(t=>tileInfo(t).suit));
  const hasHonor=allSetTiles.some(t=>tileInfo(t).honor);
  const isAllSimple=allSetTiles.every(t=>{const i=tileInfo(t); return !i.honor && i.val!==1 && i.val!==9;});
  if(isAllSimple) patterns.push({name:'All Simples',points:1,detail:'No terminal (1/9) or honor tiles used.'});
  if(suitsUsed.size===1 && !hasHonor) patterns.push({name:'Full Flush',points:7,detail:'The entire hand uses a single suit only.'});
  else if(suitsUsed.size===1 && hasHonor) patterns.push({name:'Half Flush',points:3,detail:'The hand uses one suit plus Winds/Dragons.'});
  const isMixOrphan = groups.every(groupHasOrphan) && (tileInfo(pair).honor || tileInfo(pair).val===1 || tileInfo(pair).val===9);
  if(isMixOrphan) patterns.push({name:'Mixed Orphans',points:3,detail:'Every set and the pair contain a terminal or honor.'});
  if(isMixOrphan && !hasHonor) patterns.push({name:'Pure Orphans',points:5,detail:'Every set and the pair contain a 1 or 9, no honors.'});
  const isAllHonor=allSetTiles.every(t=>tileInfo(t).honor);
  if(isAllHonor) patterns.push({name:'All Honor',points:10,detail:'Every tile is a Wind or Dragon.'});
  for(const suit of suitsUsed){
    const starts=groups.filter(g=>g.type==='CHI'&&tileInfo(g.tiles[0]).suit===suit).map(g=>tileInfo(g.tiles[0]).val);
    if([1,4,7].every(s=>starts.includes(s))){patterns.push({name:'Pure Straight',points:3,detail:`Contains ${SUIT_NAME[suit]} 123, 456 and 789.`});break;}
  }
  const dragonGroups=groups.filter(g=>g.type==='PONG'&&tileInfo(g.tiles[0]).honor&&tileInfo(g.tiles[0]).kind==='DRAG');
  if(dragonGroups.length>0) patterns.push({name:'Dragon',points:dragonGroups.length,detail:`${dragonGroups.length} Dragon Pong/Kong set(s).`});
  if(dragonGroups.length===2){
    const have=dragonGroups.map(g=>tileInfo(g.tiles[0]).val);
    const missing=['R','G','W'].filter(d=>!have.includes(d));
    if(missing.length===1 && tileInfo(pair).honor && tileInfo(pair).kind==='DRAG' && tileInfo(pair).val===missing[0])
      patterns.push({name:'Little Dragon',points:5,detail:'Two Dragon Pongs plus a pair of the third Dragon.'});
  }
  if(dragonGroups.length===3) patterns.push({name:'Great Dragon',points:8,detail:'All three Dragons as Pongs or Kongs.'});
  const windGroups=groups.filter(g=>g.type==='PONG'&&tileInfo(g.tiles[0]).honor&&tileInfo(g.tiles[0]).kind==='WIND');
  if(windGroups.length===3){
    const have=windGroups.map(g=>tileInfo(g.tiles[0]).val);
    const missing=['E','S','W','N'].filter(w=>!have.includes(w));
    if(missing.length===1 && tileInfo(pair).honor && tileInfo(pair).kind==='WIND' && tileInfo(pair).val===missing[0])
      patterns.push({name:'Little Wind',points:10,detail:'Three Wind Pongs plus a pair of the fourth Wind.'});
  }
  if(windGroups.length===4) patterns.push({name:'Great Wind',points:13,detail:'All four Winds as Pongs or Kongs.'});
  const seatG=groups.find(g=>g.type==='PONG'&&tileInfo(g.tiles[0]).honor&&tileInfo(g.tiles[0]).kind==='WIND'&&tileInfo(g.tiles[0]).val===seatWind);
  if(seatG) patterns.push({name:'Seat Wind',points:1,detail:`Pong/Kong of the player's own Seat Wind (${windName(seatWind)}).`});
  const roundG=groups.find(g=>g.type==='PONG'&&tileInfo(g.tiles[0]).honor&&tileInfo(g.tiles[0]).kind==='WIND'&&tileInfo(g.tiles[0]).val===roundWind);
  if(roundG) patterns.push({name:'Round Wind',points:1,detail:`Pong/Kong of the current Round Wind (${windName(roundWind)}).`});
  return patterns;
}

function analyzeHand(input){
  const {concealedTiles,melds,declaredPair,flowers,roundWind,seatWind,winMethod,isLastTile,isRobbingKong,isConcealedHand}=input;
  const meldTiles=melds.flatMap(m=>m.tiles);
  const allTiles=[...concealedTiles,...meldTiles];
  let candidates=[];
  if(melds.length===0 && !declaredPair && sevenPairs(allTiles))
    candidates.push({source:'Seven Pairs',patterns:[{name:'Seven Pairs',points:4,detail:'The hand is made of seven distinct pairs.'}],groups:[],pair:null});
  if(melds.length===0 && !declaredPair && thirteenOrphans(allTiles))
    candidates.push({source:'13 Orphans',patterns:[{name:'13 Orphans',points:13,detail:'One of each terminal & honor tile, plus one duplicate.'}],groups:[],pair:null});
  if(melds.length===0 && !declaredPair && nineGates(concealedTiles))
    candidates.push({source:'Nine Gates',patterns:[{name:'Nine Gates',points:15,detail:'Concealed 1112345678999 in one suit plus an extra tile of that suit.'}],groups:[],pair:null});
  if(fourKongs(melds,concealedTiles))
    candidates.push({source:'Four Kongs',patterns:[{name:'Four Kongs',points:12,detail:'Four Kong melds plus a pair.'}],groups:meldsToGroups(melds),pair:concealedTiles[0]});
  const needed=4-melds.length;
  if(needed>=0){
    if(declaredPair){
      const remaining=removeN(removeN(concealedTiles,declaredPair[0],1),declaredPair[1],1);
      for(const groups of solveGroups(sortTiles(remaining))){
        if(groups.length===needed){
          const allGroups=[...meldsToGroups(melds),...groups];
          candidates.push({source:'Standard Hand',patterns:scoreStandard(allGroups,declaredPair[0],roundWind,seatWind),groups:allGroups,pair:declaredPair[0]});
        }
      }
    } else {
      for(const d of enumerateDecomp(concealedTiles,needed)){
        const groups=[...meldsToGroups(melds),...d.groups];
        candidates.push({source:'Standard Hand',patterns:scoreStandard(groups,d.pair,roundWind,seatWind),groups,pair:d.pair});
      }
    }
  }
  if(candidates.length===0){
    return {isWinningHand:false,detectedPatterns:[],additionalPoints:[],totalPoints:0,explanation:'No valid winning structure was found for these tiles. Check the tile count, groups and pair.'};
  }
  const additional=[];
  if(winMethod==='SELF_DRAW') additional.push({name:'Self Draw',points:1,detail:'The winning tile came from the wall.'});
  if(isLastTile) additional.push({name:'Last Tile',points:1,detail:'Won on the final live-wall tile.'});
  if(winMethod==='DISCARD_WIN' && isConcealedHand) additional.push({name:'Concealed Hand',points:1,detail:'Marked as concealed — no exposed melds, and the win was on a discard.'});
  if(isRobbingKong) additional.push({name:'Robbing the Kong',points:1,detail:'Won on the tile another player added to an exposed Pong to make a Kong.'});
  const suitable=flowers.filter(f=>FLOWER_SEAT[f]===seatWind);
  if(suitable.length>0) additional.push({name:'Suitable Flower',points:suitable.length,detail:`${suitable.length} flower/season tile(s) matched this seat.`});
  if(flowers.length===0) additional.push({name:'No Flower',points:1,detail:'The hand was completed without drawing any Flower/Season.'});
  const additionalSum=additional.reduce((s,p)=>s+p.points,0);
  // Tiles like 1,1,1,2,2,2,3,3,3 can genuinely be read as three Pongs OR three Chows — that's a real
  // ambiguity in Mahjong, not something the tiles alone resolve. So instead of silently assuming
  // whichever reading scores highest, collect every distinct valid reading and let the caller ask.
  const seen=new Set();
  const options=[];
  for(const c of candidates){
    let detected=c.patterns.length?c.patterns:[{name:'Chicken Hand',points:0,detail:'A valid winning hand with no additional scoring pattern.'}];
    const totalPoints=detected.reduce((s,p)=>s+p.points,0)+additionalSum;
    const sig=c.source+'|'+detected.map(p=>p.name+':'+p.points).sort().join(',');
    if(seen.has(sig)) continue;
    seen.add(sig);
    options.push({structure:c.source,detectedPatterns:detected,totalPoints});
  }
  options.sort((a,b)=>b.totalPoints-a.totalPoints);
  if(options.length===1){
    return {isWinningHand:true,handStructure:options[0].structure,detectedPatterns:options[0].detectedPatterns,additionalPoints:additional,totalPoints:options[0].totalPoints};
  }
  return {isWinningHand:true,needsChoice:true,additionalPoints:additional,options:options.slice(0,6)};
}

function emptyGame(name,players,roundWind,dealerIdx){
  const scores={}; players.forEach(p=>scores[p.id]=0);
  return {id:'g'+Date.now(),name:name||'',players,roundWind,dealerIdx,dealerTurnInRound:1,hands:[],scores,createdAt:new Date().toISOString()};
}
/** The player object of the current dealer (dealer changes as the game progresses). */
function currentDealer(g){ return g.players[g.dealerIdx]; }
/** A player's seat wind is not fixed — it rotates together with the dealer.
 *  Whoever is dealer is always East; winds are assigned counterclockwise from there. */
function seatWindOf(g,playerIndex){
  const winds=['E','S','W','N'];
  return winds[(playerIndex-g.dealerIdx+4)%4];
}
/** After a hand is recorded, rotate the dealer/round wind per standard Mahjong rules:
 *  winning dealer stays; a non-dealer win passes the dealer to the next player (counterclockwise).
 *  Once all 4 players have held the dealer seat in the current round wind, the round wind advances. */
function advanceDealerAndRound(g,winnerId){
  const dealerId=currentDealer(g).id;
  if(winnerId===dealerId) return; // dealer repeats — nothing to rotate
  g.dealerIdx=(g.dealerIdx+1)%g.players.length;
  g.dealerTurnInRound=(g.dealerTurnInRound||1)+1;
  if(g.dealerTurnInRound>g.players.length){
    const winds=['E','S','W','N'];
    g.roundWind=winds[(winds.indexOf(g.roundWind)+1)%winds.length];
    g.dealerTurnInRound=1;
  }
}
/** Commit a chosen scoring interpretation (there's only ever one to choose from unless the tiles were genuinely ambiguous, e.g. 123+123+123 read as Chows vs Pongs). */
function finalizeResult(mode,resObj){
  S.lastResult={isWinningHand:true,handStructure:resObj.handStructure,detectedPatterns:resObj.detectedPatterns,additionalPoints:resObj.additionalPoints,totalPoints:resObj.totalPoints};
  S.resultMode=mode; S.photoDataUrl=null; S.pendingChoice=null;
  if(mode==='game'){
    const g=S.games.find(x=>x.id===S.currentGameId);
    const winner=g.players.find(p=>p.id===S.winCtx.winnerId);
    const others=g.players.filter(p=>p.id!==winner.id);
    let settlement={};
    if(S.winCtx.winMethod==='SELF_DRAW'){settlement[winner.id]=resObj.totalPoints*3;others.forEach(p=>settlement[p.id]=-resObj.totalPoints);}
    else{settlement[winner.id]=resObj.totalPoints;others.forEach(p=>settlement[p.id]=p.id===S.winCtx.discardedBy?-resObj.totalPoints:0);}
    S.lastSettlement=settlement;
  } else {
    S.lastSettlement=null;
  }
  S.view='result';
}

function applyLanguage(){
  document.documentElement.lang = LANG==='id' ? 'id' : 'en';
  document.title = LANG==='id' ? 'MAJÉ — Penghitung Skor Mahjong' : 'MAJÉ — Mahjong Scorer';
  const en=document.getElementById('langEN'), id=document.getElementById('langID');
  if(en) en.classList.toggle('active', LANG==='en');
  if(id) id.classList.toggle('active', LANG==='id');

  const dict=I18N.id;
  if(LANG==='en') return;

  const walker=document.createTreeWalker(document.getElementById('app'), NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);

  // Replace longer phrases first, then smaller UI fragments.
  const entries=Object.entries(dict).sort((a,b)=>b[0].length-a[0].length);
  nodes.forEach(node=>{
    let v=node.nodeValue;
    if(!v || !v.trim()) return;
    entries.forEach(([en,idText])=>{
      if(v.includes(en)) v=v.split(en).join(idText);
    });
    node.nodeValue=v;
  });

  document.querySelectorAll('input[placeholder]').forEach(el=>{
    const p=el.getAttribute('placeholder');
    if(p==='e.g. Sunday Table 2') el.setAttribute('placeholder','contoh: Meja Minggu 2');
  });
}

  const winner = (mode==='game' && g) ? g.players.find(p=>p.id===S.winCtx.winnerId) : null;
  const resultSeatWind = winner ? seatWindOf(g,g.players.findIndex(p=>p.id===winner.id)) : S.winCtx.seatWind;
  const resultWinLabel = S.winCtx.winMethod==='SELF_DRAW' ? 'Self Draw' : S.winCtx.winMethod==='DISCARD_WIN' ? 'Discard Win' : '';
  const resultMeta = [resultWinLabel, resultSeatWind ? `${windName(resultSeatWind)} Seat` : ''].filter(Boolean).join(' · ');
  const resultTiles = sortTiles([...(S.draft?.concealedTiles||[])]); // groups & pair reference concealedTiles, so don't add them again
  return h`
  <div class="px-5 pt-10 pb-6">
    <!-- 1. Score and winning context -->
    <div class="text-center pop">
      <div class="text-5xl font-bold">${r.totalPoints}</div>
      <div class="sans text-xs uppercase tracking-widest text-[#8a5a63] mt-1">POINTS</div>
      ${resultMeta?`<div class="sans text-sm text-[#8a5a63] mt-2">${resultMeta}</div>`:''}
    </div>

    <!-- 2. Winning tile layout -->
    <div class="mt-5 pop">
      <div class="section-title mb-2">Winning Hand</div>
      <div class="flex flex-wrap justify-center gap-1.5 py-3 px-2 rounded-2xl border border-[#E4D6D6] bg-white">
        ${resultTiles.map(t=>`<div class="tile mini">${tileShort(t)}</div>`).join('')}
      </div>
    </div>

    <!-- 3. Point details -->
    <div class="card mt-5 pop">
      <div class="section-title">Detected Patterns</div>
      ${r.detectedPatterns.map(patternRow).join('')}
      ${r.additionalPoints.length?`<div class="section-title mt-3">Additional Points</div>${r.additionalPoints.map(patternRow).join('')}`:''}
    </div>
    ${settlement && g?`<div class="card mt-4 pop">
      <div class="section-title">Settlement</div>
      ${g.players.map(p=>`<div class="flex justify-between sans text-sm py-1"><span>${p.name}</span><span class="font-bold" style="color:${settlement[p.id]>=0?'#5B0015':'#a33'}">${settlement[p.id]>=0?'+':''}${settlement[p.id]}</span></div>`).join('')}
    </div>`:''}
    <div class="section-title mt-5">Winning Hand Card</div>
    <label for="photoInputEl" class="btn ${S.photoDataUrl?'btn-ghost':'btn-primary'} sans !min-h-[56px] cursor-pointer flex items-center justify-center gap-2 mb-1">
      <span style="font-size:20px;">📷</span>
      <span>${S.photoDataUrl?'✓ Photo added — tap to change':'Take / Upload Photo of Your Hand'}</span>
    </label>
    <input id="photoInputEl" type="file" accept="image/*" capture="environment" class="hidden" onchange="app.handlePhoto(event)">
    <div class="sans text-xs text-[#8a5a63] mb-2 text-center">This photo appears on your shareable card. Skip it to use the digital tile layout instead.</div>
    <div class="mt-1 rounded-2xl overflow-hidden border border-[#E4D6D6] shadow-sm">
      <canvas id="cardCanvas" style="width:100%;display:block;background:#F7F4F0;"></canvas>
    </div>
    <div class="flex gap-2 mt-3">
      <button class="btn btn-ghost sans !min-h-[44px] text-sm flex-1" onclick="app.saveCardImage()">💾 Save Image</button>
      <button class="btn btn-primary sans !min-h-[44px] text-sm flex-1" onclick="app.shareCardImage()">📤 Share</button>
    </div>
    <div class="flex flex-col gap-2 mt-5">
    ${mode==='game'?`<button class="btn btn-primary sans" onclick="app.act('CONFIRM_RESULT')">Confirm Result</button>`:
      `<button class="btn btn-primary sans" onclick="app.act('SAVE_QUICK')">Save to History</button>`}
      <button class="btn btn-secondary sans" onclick="app.act('BACK_TO_BUILDER')">← Edit Hand</button>
    </div>
  </div>`;
}

function viewHistory(){
  return h`
  <div class="px-5 pt-10 pb-4"><button class="sans text-sm text-[#8a5a63]" onclick="app.act('GO_HOME')">← Home</button>
  <div class="text-2xl font-bold mt-3">Game History</div></div>
  <div class="px-5 flex flex-col gap-3">
  ${S.games.length===0 && S.quickHands.length===0?`<div class="sans text-sm text-[#8a5a63]">Nothing here yet.</div>`:''}
  ${S.games.slice().reverse().map(g=>`<div class="card cursor-pointer" onclick="app.act('OPEN_GAME','${g.id}')">
    <div class="flex justify-between"><span class="font-bold">${g.name||'Untitled Game'}</span><span class="sans text-xs text-[#8a5a63]">${new Date(g.createdAt).toLocaleDateString()}</span></div>
    <div class="sans text-xs text-[#8a5a63] mt-1">${g.players.map(p=>`${p.name} ${g.scores[p.id]>=0?'+':''}${g.scores[p.id]}`).join(' · ')}</div>

  ${S.quickHands.slice().reverse().map(qh=>`<div class="card">

function render(){
  const el=document.getElementById('app');
  let html='';
  switch(S.view){
    case 'home': html=viewHome(); break;
    case 'newGame': html=viewNewGame(); break;
    case 'game': html=viewGame(); break;
    case 'recordWin': html=viewRecordWin(); break;
    case 'quick': html=viewQuick(); break;
    case 'result': html=viewResult(); break;
    case 'chooseInterpretation': html=viewChooseInterpretation(); break;
    case 'history': html=viewHistory(); break;
    default: html=viewHome();
  }
  el.innerHTML=html;
  applyLanguage();
  if(S.view==='result' && S.lastResult && S.lastResult.isWinningHand){
    setTimeout(()=>{ try{ app.refreshCard(); }catch(e){} },0);
  }
}

/* ============================= WINNING HAND CARD (canvas export) ============================= */
function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath(); ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function loadImage(src){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>res(img);img.onerror=rej;img.src=src;});}
function drawCoverImage(ctx,img,x,y,w,h,r){
  roundRectPath(ctx,x,y,w,h,r); ctx.save(); ctx.clip();
  const scale=Math.max(w/img.width,h/img.height);
  const dw=img.width*scale, dh=img.height*scale;
  ctx.drawImage(img,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
  ctx.restore();
}
let _logoImgPromise=null;
function getLogoImage(){ if(!_logoImgPromise) _logoImgPromise=loadImage(MAJE_LOGO_DATA_URI); return _logoImgPromise; }
async function drawResultCard(canvas,data){
  const W=1080,H=1920;
  canvas.width=W; canvas.height=H;
  const ctx=canvas.getContext('2d');
  ctx.fillStyle='#F7F4F0'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#5B0015'; ctx.fillRect(0,0,W,14);
  ctx.textAlign='center';
  let y=70;
  try{ const logo=await getLogoImage(); const logoSize=250; ctx.drawImage(logo,W/2-logoSize/2,y,logoSize,logoSize); y+=logoSize+18; }
  catch(e){ ctx.fillStyle='#5B0015'; ctx.font='bold 76px Georgia, serif'; ctx.fillText('MAJÉ',W/2,y+76); y+=122; }
  ctx.fillStyle='#8a5a63'; ctx.font='26px Georgia, serif'; ctx.fillText('W I N N I N G   H A N D  ✨',W/2,y); y+=56;

  if(data.photoDataUrl){
    try{ const img=await loadImage(data.photoDataUrl); const boxH=520; drawCoverImage(ctx,img,64,y,W-128,boxH,28); y+=boxH+40; }catch(e){}
  }
  ctx.fillStyle='#5B0015'; ctx.font='bold 46px Georgia, serif'; ctx.fillText(data.playerName,W/2,y); y+=40;
  if(data.gameLabel){ ctx.fillStyle='#8a5a63'; ctx.font='24px Georgia, serif'; ctx.fillText(data.gameLabel,W/2,y); y+=36; }
  y+=24;

  const panelX=64, panelW=W-128, rowH=58;

  // Result summary first: score, then winning method / seat information.
  // Decorative divider runs behind the upper-middle of the score, matching the reference layout.
  ctx.strokeStyle='#E4D6D6'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(panelX,y+62); ctx.lineTo(panelX+panelW,y+62); ctx.stroke();
  ctx.fillStyle='#5B0015'; ctx.font='bold 140px Georgia, serif'; ctx.fillText(String(data.totalPoints),W/2,y+110); y+=162;
  ctx.fillStyle='#8a5a63'; ctx.font='bold 30px -apple-system,sans-serif'; ctx.fillText('POINTS',W/2,y); y+=54;

  const ctxParts=[data.winMethodLabel,data.seatWindLabel?data.seatWindLabel+' Seat':null,data.flowersLabel||null].filter(Boolean);
  if(ctxParts.length){ ctx.fillStyle='#3a1c22'; ctx.font='26px -apple-system,sans-serif'; ctx.fillText(ctxParts.join('  ·  '),W/2,y); y+=58; }

  // Tile layout comes before the detailed scoring breakdown.
  if(data.tiles.length){
    const compact=!!data.photoDataUrl;
    const tileW=compact?50:76, tileH=compact?66:100, gap=compact?6:10;
    const maxPerRow=compact?12:9;
    const perRow=Math.min(maxPerRow,Math.max(1,Math.floor((panelW+gap)/(tileW+gap))),data.tiles.length);
    if(compact){ ctx.fillStyle='#8a5a63'; ctx.font='bold 20px -apple-system,sans-serif'; ctx.fillText('TILES',W/2,y-6); y+=18; }
    const tileImgs={};
    await Promise.all(data.tiles.map(async k=>{ if(TILE_IMG[k] && !tileImgs[k]) tileImgs[k]=await loadImage(TILE_IMG[k]).catch(()=>null); }));
    const rows=[]; for(let i=0;i<data.tiles.length;i+=perRow) rows.push(data.tiles.slice(i,i+perRow));
    rows.forEach((rowTiles,rIdx)=>{
      const rowW=rowTiles.length*(tileW+gap)-gap, rx0=W/2-rowW/2, tyy=y+rIdx*(tileH+gap);
      rowTiles.forEach((t,ci)=>{
        const tx=rx0+ci*(tileW+gap);
        ctx.fillStyle='#fffdf8'; roundRectPath(ctx,tx,tyy,tileW,tileH,10); ctx.fill();
        ctx.strokeStyle='#d8cdbd'; ctx.lineWidth=2; roundRectPath(ctx,tx,tyy,tileW,tileH,10); ctx.stroke();
        const im=tileImgs[t];
        if(im){
          const pad=compact?5:8;
          const sc=Math.min((tileW-2*pad)/im.width,(tileH-2*pad)/im.height);
          const dw=im.width*sc, dh=im.height*sc;
          ctx.drawImage(im,tx+(tileW-dw)/2,tyy+(tileH-dh)/2,dw,dh);
        } else {
          ctx.fillStyle='#3a1c22'; ctx.font=`bold ${compact?24:34}px "Segoe UI Symbol","Noto Sans Symbols2",-apple-system,sans-serif`;
          const txt=t.startsWith('FLW_')?TILE_GLYPH[t]+SEAT_NUM[FLOWER_SEAT[t]]:(TILE_GLYPH[t]||t);
          ctx.fillText(txt,tx+tileW/2,tyy+tileH/2+(compact?8:11));
        }
      });
    });
    y+=rows.length*(tileH+gap)+30;
  }

  // Detailed scoring breakdown comes last.
  const patterns=data.patterns.length?data.patterns:[{name:'Chicken Hand',points:0}];
  const panelH=40+patterns.length*rowH+26;
  ctx.fillStyle='#fff'; roundRectPath(ctx,panelX,y,panelW,panelH,24); ctx.fill();
  ctx.strokeStyle='#E4D6D6'; ctx.lineWidth=2; roundRectPath(ctx,panelX,y,panelW,panelH,24); ctx.stroke();
  let py=y+54;
  patterns.forEach(p=>{
    ctx.textAlign='left'; ctx.fillStyle='#3a1c22'; ctx.font='bold 30px -apple-system,sans-serif'; ctx.fillText(p.name,panelX+36,py);
    ctx.textAlign='right'; ctx.fillStyle='#5B0015'; ctx.fillText((p.points>0?'+':'')+p.points,panelX+panelW-36,py);
    py+=rowH;
  });
  ctx.textAlign='center'; y+=panelH+36;

  if(data.settlementLines && data.settlementLines.length){
    y+=12; ctx.strokeStyle='#E4D6D6'; ctx.beginPath(); ctx.moveTo(panelX,y); ctx.lineTo(panelX+panelW,y); ctx.stroke(); y+=42;
    ctx.fillStyle='#8a5a63'; ctx.font='bold 22px -apple-system,sans-serif'; ctx.fillText('PAYMENT',W/2,y); y+=42;
    data.settlementLines.forEach(l=>{
      ctx.textAlign='left'; ctx.fillStyle='#3a1c22'; ctx.font='26px -apple-system,sans-serif'; ctx.fillText(l.name,panelX+20,y);
      ctx.textAlign='right'; ctx.fillStyle=l.value>=0?'#5B0015':'#a33'; ctx.fillText((l.value>=0?'+':'')+l.value,panelX+panelW-20,y);
      y+=38;
    });
    ctx.textAlign='center';
  }

  ctx.fillStyle='#8a5a63'; ctx.font='22px -apple-system,sans-serif'; ctx.fillText(data.date,W/2,H-170);
  ctx.strokeStyle='#E4D6D6'; ctx.beginPath(); ctx.moveTo(panelX,H-140); ctx.lineTo(panelX+panelW,H-140); ctx.stroke();
  ctx.fillStyle='#5B0015'; ctx.font='bold 26px Georgia, serif'; ctx.fillText('MAJE Mahjong & Shaokao - Gading Serpong',W/2,H-92);
  ctx.fillStyle='#8a5a63'; ctx.font='24px -apple-system,sans-serif'; ctx.fillText('@majemahjong',W/2,H-56);
}

/* ============================= ACTIONS ============================= */
const app={
  setDraftName(v){ S.draft.name=v; },
  setDraftPlayer(i,v){ S.draft.players[i]=v; },
  act(type,payload){
    switch(type){
      case 'GO_HOME': S.view='home'; break;
      case 'GO_NEW_GAME': S.draft={name:'',players:['Player 1','Player 2','Player 3','Player 4'],roundWind:'E',dealerIdx:0}; S.view='newGame'; break;
      case 'SET_ROUND': S.draft.roundWind=payload; break;
      case 'SET_DEALER': S.draft.dealerIdx=payload; break;
      case 'START_GAME': {
        const players=S.draft.players.map((name,i)=>({id:'p'+i+'_'+Date.now(),name:name||('Player '+(i+1))}));
        const g=emptyGame(S.draft.name,players,S.draft.roundWind,S.draft.dealerIdx);
        S.games.push(g); save(); S.currentGameId=g.id; S.view='game'; break;
      }
      case 'OPEN_GAME': S.currentGameId=payload; S.view='game'; break;
      case 'GO_GAME': S.view='game'; break;
      case 'GO_HISTORY': S.view='history'; break;
      case 'GO_RECORD_WIN': S.winCtx={winnerId:null,winMethod:null,discardedBy:null,isLastTile:false,isRobbingKong:false,isConcealedHand:false}; S.draft=newDraft(); S.view='recordWin'; break;
      case 'GO_QUICK': S.winCtx={winMethod:null,discardedBy:null,seatWind:null,roundWind:null,isLastTile:false,isRobbingKong:false,isConcealedHand:false}; S.draft=newDraft(); S.view='quick'; break;
      case 'PICK_WINNER': S.winCtx.winnerId=payload; break;
      case 'BACK_WINNER': S.winCtx.winnerId=null; break;
      case 'PICK_METHOD': S.winCtx.winMethod=payload; if(payload==='SELF_DRAW') S.winCtx.isConcealedHand=false; break;
      case 'BACK_METHOD': S.winCtx.winMethod=null; S.winCtx.discardedBy=null; break;
      case 'PICK_DISCARDER': S.winCtx.discardedBy=payload; break;
      case 'TOGGLE_LAST_TILE': S.winCtx.isLastTile=!S.winCtx.isLastTile; break;
      case 'TOGGLE_ROBBING_KONG': S.winCtx.isRobbingKong=!S.winCtx.isRobbingKong; break;
      case 'TOGGLE_CONCEALED': if(S.winCtx.winMethod!=='SELF_DRAW') S.winCtx.isConcealedHand=!S.winCtx.isConcealedHand; break;
      case 'ADD_TILE': {
        if(countAllCopies(S.draft,payload)>=4){alert('Only 4 copies of a tile exist — you already have 4 of this one.');break;}
        S.draft.concealedTiles.push(payload); break;
      }
      case 'REMOVE_TILE_AT': S.draft.concealedTiles.splice(payload,1); break;
      case 'TOGGLE_FLOWER': {
        const i=S.draft.flowers.indexOf(payload);
        if(i>=0) S.draft.flowers.splice(i,1); else S.draft.flowers.push(payload);
        break;
      }
      case 'SELECT_FOR_GROUP': S.draft.pendingSelection.push(payload); break;
      case 'DESELECT_FOR_GROUP': {
        const i=S.draft.pendingSelection.indexOf(payload);
        if(i>=0) S.draft.pendingSelection.splice(i,1);
        break;
      }
      case 'CLEAR_SELECTION': S.draft.pendingSelection=[]; break;
      case 'CONFIRM_GROUP': {
        const type=payload, sel=S.draft.pendingSelection;
        if(!selectionValidFor(sel,type)){ alert('That selection isn\'t a valid '+(type==='PAIR'?'pair':type)+'.'); break; }
        if(type==='PAIR'){
          if(S.draft.declaredPair){ alert('Only one pair allowed — remove the existing pair first.'); break; }
          S.draft.declaredPair=[...sel];
        } else {
          S.draft.groups.push({type,tiles:[...sel]});
        }
        S.draft.pendingSelection=[];
        break;
      }
      case 'REMOVE_GROUP': S.draft.groups.splice(payload,1); break;
      case 'CLEAR_PAIR': S.draft.declaredPair=null; break;
      case 'QSET': S.winCtx[payload]=arguments[0]; break; // placeholder, real handled below
      case 'ANALYZE_GAME': {
        const g=S.games.find(x=>x.id===S.currentGameId);
        const winnerIdx=g.players.findIndex(p=>p.id===S.winCtx.winnerId);
        const auto=autoDetectMelds(ungroupedTiles(S.draft));
        const finalMelds=[...S.draft.groups,...auto.melds];
        const concealedForAnalysis=S.draft.declaredPair?auto.concealedTiles.concat(S.draft.declaredPair):auto.concealedTiles;
        const result=analyzeHand({
          concealedTiles:concealedForAnalysis, melds:finalMelds, declaredPair:S.draft.declaredPair, flowers:S.draft.flowers,
          roundWind:g.roundWind, seatWind:seatWindOf(g,winnerIdx), winMethod:S.winCtx.winMethod,
          isLastTile:S.winCtx.isLastTile, isRobbingKong:S.winCtx.isRobbingKong, isConcealedHand:S.winCtx.isConcealedHand
        });
        if(!result.isWinningHand){ S.lastResult=result; S.resultMode='game'; S.view='result'; break; }
        if(result.needsChoice){ S.pendingChoice={mode:'game',additionalPoints:result.additionalPoints,options:result.options}; S.view='chooseInterpretation'; break; }
        finalizeResult('game',result); break;
      }
      case 'ANALYZE_QUICK': {
        const auto=autoDetectMelds(ungroupedTiles(S.draft));
        const finalMelds=[...S.draft.groups,...auto.melds];
        const concealedForAnalysis=S.draft.declaredPair?auto.concealedTiles.concat(S.draft.declaredPair):auto.concealedTiles;
        const result=analyzeHand({
          concealedTiles:concealedForAnalysis, melds:finalMelds, declaredPair:S.draft.declaredPair, flowers:S.draft.flowers,
          roundWind:S.winCtx.roundWind||'E', seatWind:S.winCtx.seatWind||'E', winMethod:S.winCtx.winMethod,
          isLastTile:S.winCtx.isLastTile, isRobbingKong:S.winCtx.isRobbingKong, isConcealedHand:S.winCtx.isConcealedHand
        });
        if(!result.isWinningHand){ S.lastResult=result; S.resultMode='quick'; S.view='result'; break; }
        if(result.needsChoice){ S.pendingChoice={mode:'quick',additionalPoints:result.additionalPoints,options:result.options}; S.view='chooseInterpretation'; break; }
        finalizeResult('quick',result); break;
      }
      case 'CHOOSE_INTERPRETATION': {
        const opt=S.pendingChoice.options[payload];
        finalizeResult(S.pendingChoice.mode,{handStructure:opt.structure,detectedPatterns:opt.detectedPatterns,additionalPoints:S.pendingChoice.additionalPoints,totalPoints:opt.totalPoints});
        break;
      }
      case 'CANCEL_CHOICE': S.pendingChoice=null; S.view = S.resultMode==='game' ? 'recordWin' : 'quick'; break;
      case 'BACK_TO_BUILDER': S.view = S.resultMode==='game' ? 'recordWin' : 'quick'; break;
      case 'CONFIRM_RESULT': {
        const g=S.games.find(x=>x.id===S.currentGameId);
        const winnerIdx=g.players.findIndex(p=>p.id===S.winCtx.winnerId);
        const hand={
          id:'h'+Date.now(), winnerId:S.winCtx.winnerId, tiles:S.draft.concealedTiles, exposedMelds:S.draft.groups,
          flowers:S.draft.flowers, winMethod:S.winCtx.winMethod, discardedBy:S.winCtx.discardedBy||null,
          isLastTile:S.winCtx.isLastTile, isRobbingKong:!!S.winCtx.isRobbingKong, roundWind:g.roundWind, winnerSeatWind:seatWindOf(g,winnerIdx),
          dealerPlayerId:currentDealer(g).id, scoringPatterns:S.lastResult.detectedPatterns.concat(S.lastResult.additionalPoints),
          totalPoints:S.lastResult.totalPoints, settlement:S.lastSettlement
        };
        g.hands.push(hand);
        g.players.forEach(p=>{g.scores[p.id]=(g.scores[p.id]||0)+S.lastSettlement[p.id];});
        advanceDealerAndRound(g,S.winCtx.winnerId);
        save(); S.view='game'; break;
      }
      case 'SAVE_QUICK': {
        S.quickHands.push({id:'q'+Date.now(),tiles:S.draft.concealedTiles,exposedMelds:S.draft.groups,flowers:S.draft.flowers,
          scoringPatterns:S.lastResult.detectedPatterns.concat(S.lastResult.additionalPoints),totalPoints:S.lastResult.totalPoints,createdAt:new Date().toISOString()});
        save(); S.view='history'; break;
      }
      case 'VIEW_HAND': {
        const g=S.games.find(x=>x.id===payload.gid); const hd=g.hands[payload.idx];
        const ADDITIONAL_NAMES=['Self Draw','Last Tile','Robbing the Kong','Concealed Hand','Kong','Suitable Flower','No Flower'];
        S.lastResult={isWinningHand:true,handStructure:'Saved Hand',detectedPatterns:hd.scoringPatterns.filter(p=>!ADDITIONAL_NAMES.includes(p.name)),additionalPoints:hd.scoringPatterns.filter(p=>ADDITIONAL_NAMES.includes(p.name)),totalPoints:hd.totalPoints};
        S.photoDataUrl=null; S.draft={concealedTiles:hd.tiles,groups:hd.exposedMelds||[],declaredPair:null,pendingSelection:[],flowers:hd.flowers}; S.winCtx={winMethod:hd.winMethod,isLastTile:hd.isLastTile,isRobbingKong:!!hd.isRobbingKong,winnerId:hd.winnerId,isConcealedHand:hd.scoringPatterns.some(p=>p.name==='Concealed Hand')};
        S.lastSettlement=hd.settlement; S.resultMode='game'; S.currentGameId=g.id; S.view='result'; break;
      }
    }
    render();
  },
  handlePhoto(ev){
    const f=ev.target.files[0]; if(!f) return;
    const reader=new FileReader();
    reader.onload=()=>{ S.photoDataUrl=reader.result; render(); };
    reader.onerror=()=>{ alert('Could not read that photo.'); };
    reader.readAsDataURL(f);
  },
  refreshCard(){
    const canvas=document.getElementById('cardCanvas');
    const r=S.lastResult; if(!canvas || !r || !r.isWinningHand) return;
    const mode=S.resultMode;
    const g = mode==='game' ? S.games.find(x=>x.id===S.currentGameId) : null;
    const winner = (mode==='game' && g) ? g.players.find(p=>p.id===S.winCtx.winnerId) : null;
    const tiles = sortTiles(S.draft.concealedTiles);
    const flowers = S.draft.flowers.map(f=>FLOWER_NAME[f]);
    const settlementLines = (mode==='game' && S.lastSettlement && g) ? g.players.map(p=>({name:p.name,value:S.lastSettlement[p.id]})) : null;
    const data={
      playerName: winner ? winner.name : 'Counted Hand',
      gameLabel: g ? (g.name||null) : null,
      patterns: r.detectedPatterns.concat(r.additionalPoints),
      totalPoints: r.totalPoints,
      winMethodLabel: S.winCtx.winMethod==='SELF_DRAW'?'Self Draw':S.winCtx.winMethod==='DISCARD_WIN'?'Discard Win':'',
      seatWindLabel: winner ? windName(seatWindOf(g,g.players.findIndex(p=>p.id===winner.id))) : (S.winCtx.seatWind?windName(S.winCtx.seatWind):''),
      flowersLabel: flowers.length?flowers.join(' + ')+' Flower'+(flowers.length>1?'s':''):'',
      tiles, settlementLines,
      date: new Date().toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'}),
      photoDataUrl: S.photoDataUrl
    };
    drawResultCard(canvas,data);
  },
  saveCardImage(){
    const canvas=document.getElementById('cardCanvas'); if(!canvas) return;
    try{
      const url=canvas.toDataURL('image/png');
      const a=document.createElement('a'); a.href=url; a.download='maje-winning-hand.png';
      document.body.appendChild(a); a.click(); a.remove();
    }catch(e){ alert('Could not save the image on this device.'); }
  },
  shareCardImage(){
    const canvas=document.getElementById('cardCanvas'); if(!canvas) return;
    try{
      canvas.toBlob(async(blob)=>{
        if(!blob){ app.saveCardImage(); return; }
        try{
          const file=new File([blob],'maje-winning-hand.png',{type:'image/png'});
          if(navigator.canShare && navigator.canShare({files:[file]})){
            await navigator.share({files:[file],title:'MAJÉ Winning Hand',text:'My winning hand at MAJÉ ✨'});
          } else {
            app.saveCardImage();
          }
        }catch(e){ /* user cancelled share — no-op */ }
      },'image/png');
    }catch(e){ app.saveCardImage(); }
  }
};
// Fix QSET (needed real 2-arg signature)
const _origAct=app.act.bind(app);
app.act=function(type,a,b){
  if(type==='QSET'){ S.winCtx[a]=b; if(a==='winMethod' && b==='SELF_DRAW') S.winCtx.isConcealedHand=false; render(); return; }
  _origAct(type,a);
};

syncLanguageNames();
render();
</script>

  // Register the PWA service worker for production/offline app-shell caching.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
